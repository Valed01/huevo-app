name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Typecheck & lint
        run: npm run typecheck && npm run lint

      # Release tag vX.Y.Z -> app version X.Y.Z (versionCode X*10000+Y*100+Z), so the in-app updater can compare.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const [a = 0, b = 0, c = 0] = v.split(/[.-]/).map(Number);
            const app = JSON.parse(fs.readFileSync("app.json"));
            app.expo.version = v;
            app.expo.android.versionCode = a * 10000 + b * 100 + c;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
            console.log("version", v, "code", app.expo.android.versionCode);
          '

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon

      # Without a keystore the APK stays signed with the debug key (fine for testing).
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD "$APK"
            rm release.jks
          fi
          mv "$APK" huevo-${GITHUB_REF_NAME//\//-}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: huevo-apk
          path: huevo-*.apk

      # "What's new" for the in-app update dialog: commit titles since the previous release.
      # Edit the release text on GitHub afterwards to word it for users.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          git log --no-merges --pretty='- %s' "$range" > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: huevo-*.apk
          body_path: notes.md
