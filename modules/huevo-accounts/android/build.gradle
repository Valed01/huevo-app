plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'su.huevo'
version = '0.1.0'

android {
  namespace "su.huevo.accounts"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Same version as react-native-webview's (WebView profiles: MULTI_PROFILE).
  implementation 'androidx.webkit:webkit:1.14.0'
}
